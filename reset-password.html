<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChargeNet // Reset Password</title>
  <meta name="description" content="Set a new secure password for your ChargeNet account.">
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="images/Charge Net Infinity Cable Logo.png">
  
  <!-- Auth Stylesheet -->
  <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-page">

  <!-- Top Floating Nav: Return to Home -->
  <nav class="auth-top-nav">
    <a href="index.html" class="back-home-btn" aria-label="Return to ChargeNet Homepage">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
      <span>Back to Home</span>
    </a>
  </nav>

  <!-- Master Auth Card (45% Art / 55% Form) -->
  <main class="auth-master-card">
    
    <!-- Left 45%: EV Station & Car Image Scene -->
    <div class="auth-visual-pane">
      <div class="auth-visual-brand">
        <img src="images/Charge Net Infinity Cable Logo.png" alt="ChargeNet Cable Logo">
        <span>ChargeNet</span>
      </div>

      <div class="auth-visual-tagline">
        <h3>Find. Reserve. Charge.</h3>
        <p>Intelligent EV Charging Network &amp; Smart Scheduling</p>
      </div>
    </div>

    <!-- Right 55%: Focused Reset Password Form -->
    <div class="auth-form-pane">
      
      <!-- Top Bar: Logo & Link back to Login -->
      <div class="form-top-bar">
        <a href="index.html" class="auth-brand" aria-label="ChargeNet Homepage">
          <img src="images/Charge Net Infinity Cable Logo.png" alt="ChargeNet Cable Logo" class="auth-brand-logo">
        </a>
        <div class="auth-switch-text">
          <a href="login.html" class="auth-switch-link">&larr; Back to Login</a>
        </div>
      </div>

      <!-- Header -->
      <div class="auth-header">
        <h1 class="auth-title">Reset <span class="highlight-orange">Password</span></h1>
        <p class="auth-subtitle">Please create a strong new password for your account.</p>
      </div>

      <!-- Form -->
      <form onsubmit="handleResetSubmit(event)" class="auth-form-container">
        
        <!-- Input 1: New Password -->
        <div class="input-group-auth">
          <input type="password" 
                 id="newPassword" 
                 class="input-field-auth" 
                 placeholder="New Password" 
                 required 
                 autocomplete="new-password">
          <span class="input-icon-auth">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
          </span>
          <button type="button" class="btn-toggle-eye" onclick="togglePasswordVisibility('newPassword', this)" aria-label="Toggle password visibility">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          </button>
        </div>

        <!-- Input 2: Confirm New Password -->
        <div class="input-group-auth" style="margin-bottom: 1.75rem;">
          <input type="password" 
                 id="confirmNewPassword" 
                 class="input-field-auth" 
                 placeholder="Confirm New Password" 
                 required 
                 autocomplete="new-password">
          <span class="input-icon-auth">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
          </span>
          <button type="button" class="btn-toggle-eye" onclick="togglePasswordVisibility('confirmNewPassword', this)" aria-label="Toggle password visibility">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          </button>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn-auth-submit">
          <span>Update Password</span>
          <span>&rarr;</span>
        </button>

      </form>
    </div>

  </main>

  <script>
    function togglePasswordVisibility(inputId, btn) {
      const input = document.getElementById(inputId);
      if (input.type === 'password') {
        input.type = 'text';
        btn.innerHTML = `
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
            <line x1="1" y1="1" x2="23" y2="23"></line>
          </svg>
        `;
      } else {
        input.type = 'password';
        btn.innerHTML = `
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
        `;
      }
    }

    function handleResetSubmit(e) {
      e.preventDefault();
      const p1 = document.getElementById('newPassword').value;
      const p2 = document.getElementById('confirmNewPassword').value;

      if (p1 !== p2) {
        alert('Passwords do not match. Please verify.');
        return;
      }

      alert('Your password has been successfully updated! Please log in with your new credentials.');
      window.location.href = 'login.html';
    }
  </script>

</body>
</html>
