<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChargeNet // Forgot Password</title>
  <meta name="description" content="Reset your ChargeNet password. Enter your registered email to receive secure recovery instructions.">
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="images/Charge Net Infinity Cable Logo.png">
  
  <!-- Auth Stylesheet -->
  <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-page">

  <!-- Top Floating Nav: Return to Home -->
  <nav class="auth-top-nav">
    <a href="index.html" class="back-home-btn" aria-label="Return to ChargeNet Homepage">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
      <span>Back to Home</span>
    </a>
  </nav>

  <!-- Master Auth Card (45% Art / 55% Form) -->
  <main class="auth-master-card">
    
    <!-- Left 45%: EV Station & Car Image Scene -->
    <div class="auth-visual-pane">
      <div class="auth-visual-brand">
        <img src="images/Charge Net Infinity Cable Logo.png" alt="ChargeNet Cable Logo">
        <span>ChargeNet</span>
      </div>

      <div class="auth-visual-tagline">
        <h3>Find. Reserve. Charge.</h3>
        <p>Intelligent EV Charging Network &amp; Smart Scheduling</p>
      </div>
    </div>

    <!-- Right 55%: Focused Forgot Password Form -->
    <div class="auth-form-pane">
      
      <!-- Top Bar: Logo & Link back to Login -->
      <div class="form-top-bar">
        <a href="index.html" class="auth-brand" aria-label="ChargeNet Homepage">
          <img src="images/Charge Net Infinity Cable Logo.png" alt="ChargeNet Cable Logo" class="auth-brand-logo">
        </a>
        <div class="auth-switch-text">
          Remember password? <a href="login.html" class="auth-switch-link">Login &rarr;</a>
        </div>
      </div>

      <!-- Header -->
      <div class="auth-header">
        <h1 class="auth-title">Forgot <span class="highlight-orange">Password?</span></h1>
        <p class="auth-subtitle">Enter your registered email address and we'll send you instructions to reset your account password.</p>
      </div>

      <!-- Form -->
      <form onsubmit="handleForgotSubmit(event)" class="auth-form-container">
        
        <!-- Input: Email Address -->
        <div class="input-group-auth" style="margin-bottom: 1.75rem;">
          <input type="email" 
                 id="recoveryEmail" 
                 class="input-field-auth" 
                 placeholder="Enter your registered email address" 
                 required 
                 autocomplete="email">
          <span class="input-icon-auth">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
          </span>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn-auth-submit">
          <span>Send Reset Link</span>
          <span>&rarr;</span>
        </button>

        <div style="text-align: center; margin-top: 2rem;">
          <a href="login.html" class="forgot-pw-link" style="display: inline-flex; align-items: center; gap: 0.4rem;">
            &larr; Back to Login
          </a>
        </div>

      </form>
    </div>

  </main>

  <script>
    function handleForgotSubmit(e) {
      e.preventDefault();
      const email = document.getElementById('recoveryEmail').value.trim();
      alert(`Password reset link sent to ${email}! Check your inbox to proceed.`);
      window.location.href = 'reset-password.html';
    }
  </script>

</body>
</html>
